<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Practice vocabulary</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <section class="start-screen" id="startScreen">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span>Vocabulary</span>
        </div>
        <h1>Practice vocabulary</h1>
        <p>Look at the image and choose the correct option before the minute is over.</p>
        <button class="start-button" id="startButton" type="button">Start</button>
      </section>

      <section class="game-screen is-hidden" id="gameScreen" aria-label="Vocabulary game">
        <header class="game-header">
          <div class="stat">
            <span>Time</span>
            <strong id="timer">1:00</strong>
          </div>
          <div class="stat">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
        </header>

        <section class="play-area">
          <div class="image-shell">
            <img id="vocabularyImage" alt="" class="vocabulary-image">
          </div>
          <p class="translation-prompt" id="translationPrompt"></p>

          <div class="answer-panel">
            <p class="feedback" id="feedback" aria-live="assertive"></p>
            <div class="options" id="options"></div>
          </div>
        </section>
      </section>

      <section class="end-screen is-hidden" id="endScreen">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span>Vocabulary</span>
        </div>
        <h1>Time is up</h1>
        <p>You scored <strong id="finalScore">0</strong> points.</p>
        <button class="start-button" id="restartButton" type="button">Play again</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
